<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Hearthbeat</title><link rel=stylesheet href=../www/hearthbeat.css></head><body>
<script>
// Preview harness: simulated sensor data, no device needed.
const Q = new URLSearchParams(location.search);
localStorage.setItem("hearthbeat-lang", Q.get("lang") || "en");
window.fetch = (u, o) => { console.log('POST', u, o && o.body); return new Promise((r) => setTimeout(() => r({ ok: true }), 300)); };
class EventSource {
  constructor() { this.l = {}; setTimeout(() => this.start(), 30); }
  addEventListener(n, f) { this.l[n] = f; }
  send(name_id, value, state) { this.l.state && this.l.state({ data: JSON.stringify({ name_id, value, state: state ?? String(value) }) }); }
  start() {
    this.l.open && this.l.open();
    const t0 = Date.now() - 14.5 * 60000, realNow = Date.now;
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 175; i++) {
      Date.now = () => t0 + i * 5000;
      this.send("sensor/Heart rate", Math.round(70 + 5 * Math.sin(i / 10) + rnd() * 4));
      this.send("sensor/Breathing rate", Math.round(14 + 2 * Math.sin(i / 14) + rnd() * 2));
    }
    Date.now = realNow;
    const alert = Q.get("m") === "alert", empty = Q.get("m") === "empty";
    const s = [
      ["binary_sensor/Presence", !empty, empty ? "OFF" : "ON"],
      ["text_sensor/Status", null, alert ? "ALERT: Fast breathing" : empty ? "Nobody in the room" : "Present, calm"],
      ["text_sensor/Last seen", null, empty ? "12 min ago" : "Now"],
      ["sensor/Heart rate 1 min average", 72], ["sensor/Breathing rate 1 min average", alert ? 29 : 15],
      ["sensor/Heart rate min today", 58], ["sensor/Heart rate max today", 91], ["sensor/Breathing rate min today", 11], ["sensor/Breathing rate max today", 19],
      ["text_sensor/Bedtime", null, "22:47"], ["text_sensor/Wake-up time", null, "06:58"], ["sensor/Time in bed", 7.6], ["sensor/Night wakings", 2],
      ["sensor/Distance", 92.4], ["sensor/People count", 1], ["sensor/Ambient light", 128], ["text_sensor/Time of day", null, "Day"],
      ["text_sensor/Room", null, Q.get("room") || "Bedroom"], ["sensor/Data quality last hour", 87], ["binary_sensor/Radar not responding", false, "OFF"],
      ["sensor/WiFi signal", -55], ["text_sensor/Uptime", null, "3d 4h"],
      ["number/Breathing high threshold", 25], ["number/Breathing low threshold", 8], ["number/Heart rate high threshold", 110],
      ["number/Heart rate low threshold", 45], ["number/Absence alert after hours", 3], ["number/Darkness threshold", 3],
      ["select/LED mode", "Status, off in the dark", "Status, off in the dark"],
      ["switch/Telegram alert started", true, "ON"], ["switch/Telegram alert cleared", true, "ON"],
      ["switch/Telegram sensor online", false, "OFF"], ["switch/Telegram morning summary", true, "ON"],
      ["text/Telegram chat ID", "123456789", "123456789"], ["number/Morning summary hour", 9],
      ["text/Message alert started", "🔴 {room}: {reason}\\nHeart rate {hr} bpm · breathing {br} /min · {time}", "🔴 {room}: {reason}\\nHeart rate {hr} bpm · breathing {br} /min · {time}"],
      ["text/Message alert cleared", "✅ {room}: alert cleared · {status}", "✅ {room}: alert cleared · {status}"],
      ["text/Message sensor online", "🟢 {room}: sensor online · {status}", "🟢 {room}: sensor online · {status}"],
      ["text/Message morning summary", "☀️ {room}, good morning! Bed {bed} → up {wake} · {inbed} in bed · {wakings} night wakings\\nHeart rate {hrmin}–{hrmax} bpm · breathing {brmin}–{brmax} /min\\nNow: {status}"],
      ["button/Send test notification", null, ""],
    ];
    for (const [k, v, st] of s) this.send(k, v, st);
    if (Q.get("view") === "settings") setTimeout(() => document.getElementById("ap-adv").click(), 50);
  }
}
</script>
<script type=module src=../www/hearthbeat.js></script><esp-app></esp-app></body></html>
