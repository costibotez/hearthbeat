# Optional add-on: Telegram notifications, sent by the sensor itself (no hub needed).
#
# Four notifications, each with its own on/off switch and editable message:
#   alert started · alert cleared · sensor online (after a restart) · morning summary
# Chat commands: send /status, /sleep, /today or /help to the bot and the sensor replies
# (only in the configured chat). Use one bot per room: each bot has its own message queue.
# Everything except the bot token can be changed in the dashboard: Settings → Telegram notifications.
#
# Setup: add telegram_bot_token and telegram_chat_id to secrets.yaml (see README), then add
#   telegram: !include hearthbeat-telegram.yaml
# under `packages:` in your room file.
#
# Placeholders available in every message:
#   {room} {status} {reason} {hr} {br} {time} {bed} {wake} {inbed} {wakings} {hrmin} {hrmax} {brmin} {brmax}
# Type \n for a line break.

substitutions:
  telegram_token: !secret telegram_bot_token
  telegram_chat: !secret telegram_chat_id
  # Default hour of the morning summary (0-23); can be changed in the dashboard
  summary_hour: "9"

esphome:
  includes:
    - hearthbeat_fmt.h
    # All Telegram traffic runs in a background task, so the sensor never pauses while waiting on the network
    - hearthbeat_tg.h

# Not used directly: it links in the ESP-IDF HTTPS client and certificate bundle that hearthbeat_tg.h uses
http_request:
  verify_ssl: true

globals:
  # Next Telegram update to fetch (everything before it has been handled)
  - id: tg_offset
    type: int64_t
    initial_value: '0'
  # Alerts raised today, for /today
  - id: alerts_today
    type: int
    initial_value: '0'
  - id: alerts_day
    type: int
    initial_value: '-1'

# ---------------------------------------------------------------------------
# Settings, editable in the dashboard and remembered after a restart
# ---------------------------------------------------------------------------
switch:
  - platform: template
    name: "Telegram alert started"
    id: tg_on_alert
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: sg_notify, sorting_weight: 10}
  - platform: template
    name: "Telegram alert cleared"
    id: tg_on_clear
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: sg_notify, sorting_weight: 20}
  - platform: template
    name: "Telegram sensor online"
    id: tg_on_online
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: sg_notify, sorting_weight: 30}
  - platform: template
    name: "Telegram morning summary"
    id: tg_on_summary
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: sg_notify, sorting_weight: 40}
  - platform: template
    name: "Telegram chat commands"
    id: tg_on_commands
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: sg_notify, sorting_weight: 45}

text:
  - platform: template
    name: "Telegram chat ID"
    id: tg_chat
    optimistic: true
    restore_value: true
    initial_value: "${telegram_chat}"
    mode: text
    max_length: 32
    web_server: {sorting_group_id: sg_notify, sorting_weight: 1}
  - platform: template
    name: "Message alert started"
    id: tg_msg_alert
    optimistic: true
    restore_value: true
    initial_value: '🔴 {room}: {reason}\nHeart rate {hr} bpm · breathing {br} /min · {time}'
    mode: text
    max_length: 255
    web_server: {sorting_group_id: sg_notify, sorting_weight: 11}
  - platform: template
    name: "Message alert cleared"
    id: tg_msg_clear
    optimistic: true
    restore_value: true
    initial_value: '✅ {room}: alert cleared · {status}'
    mode: text
    max_length: 255
    web_server: {sorting_group_id: sg_notify, sorting_weight: 21}
  - platform: template
    name: "Message sensor online"
    id: tg_msg_online
    optimistic: true
    restore_value: true
    initial_value: '🟢 {room}: sensor online · {status}'
    mode: text
    max_length: 255
    web_server: {sorting_group_id: sg_notify, sorting_weight: 31}
  - platform: template
    name: "Message morning summary"
    id: tg_msg_summary
    optimistic: true
    restore_value: true
    initial_value: '☀️ {room}, good morning! Bed {bed} → up {wake} · {inbed} in bed · {wakings} night wakings\nHeart rate {hrmin}–{hrmax} bpm · breathing {brmin}–{brmax} /min\nNow: {status}'
    mode: text
    max_length: 255
    web_server: {sorting_group_id: sg_notify, sorting_weight: 41}

number:
  - platform: template
    name: "Morning summary hour"
    id: tg_hour
    optimistic: true
    restore_value: true
    initial_value: ${summary_hour}
    min_value: 0
    max_value: 23
    step: 1
    mode: box
    web_server: {sorting_group_id: sg_notify, sorting_weight: 42}

button:
  - platform: template
    name: "Send test notification"
    on_press:
      - script.execute: {id: tg_event, kind: 4}
    web_server: {sorting_group_id: sg_notify, sorting_weight: 50}

# ---------------------------------------------------------------------------
# Sending
# ---------------------------------------------------------------------------
script:
  # Queue one message for the background sender
  - id: tg_send
    mode: queued
    max_runs: 5
    parameters:
      msg: string
      keyboard: bool
    then:
      - lambda: |-
          std::string body = json::build_json([&](JsonObject root) {
            root["chat_id"] = id(tg_chat).state;
            root["text"] = msg;
            root["disable_web_page_preview"] = true;
            if (keyboard) {
              // Tap buttons under the chat box, so nobody has to type commands
              JsonObject markup = root["reply_markup"].to<JsonObject>();
              JsonArray rows = markup["keyboard"].to<JsonArray>();
              JsonArray r1 = rows.add<JsonArray>(); r1.add("/status"); r1.add("/sleep");
              JsonArray r2 = rows.add<JsonArray>(); r2.add("/today"); r2.add("/help");
              markup["resize_keyboard"] = true;
              markup["is_persistent"] = true;
            }
          });
          hb_tg::send("https://api.telegram.org/bot${telegram_token}/sendMessage", body);

  # Build and send a notification. kind: 0 alert started, 1 alert cleared, 2 online, 3 morning summary, 4 test
  - id: tg_event
    mode: queued
    max_runs: 5
    parameters:
      kind: int
    then:
      - lambda: |-
          if (id(tg_chat).state.empty()) return;
          if ((kind == 0 && !id(tg_on_alert).state) || (kind == 1 && !id(tg_on_clear).state) ||
              (kind == 2 && !id(tg_on_online).state) || (kind == 3 && !id(tg_on_summary).state)) return;
          const std::string &tpl = kind == 1 ? id(tg_msg_clear).state : kind == 2 ? id(tg_msg_online).state
                                 : kind == 3 ? id(tg_msg_summary).state : id(tg_msg_alert).state;
          auto now = id(sntp_time).now();
          std::string bed = "–", wake = "–", inbed = "–";
          if (id(sl_bed) != 0) {
            bed = ESPTime::from_epoch_local(id(sl_bed)).strftime("%H:%M");
            wake = id(sl_active) ? std::string("still in bed") : ESPTime::from_epoch_local(id(sl_wake)).strftime("%H:%M");
            float hrs = id(sleep_hours).state;
            if (!std::isnan(hrs)) {
              int mins = (int) roundf(hrs * 60);
              char b[16];
              snprintf(b, sizeof(b), "%dh%02d", mins / 60, mins % 60);
              inbed = b;
            }
          }
          std::string reason = id(alert_reason).state == "No alert" ? std::string("–") : id(alert_reason).state;
          std::string msg = hb_fill(tpl, {
            {"room", id(room_name).state}, {"status", id(status_text).state}, {"reason", reason},
            {"hr", hb_num(id(heart_avg).state)}, {"br", hb_num(id(breath_avg).state)},
            {"time", now.is_valid() ? now.strftime("%H:%M") : std::string("–")},
            {"bed", bed}, {"wake", wake}, {"inbed", inbed},
            {"wakings", id(sl_bed) != 0 ? std::to_string(id(sl_ups)) : std::string("–")},
            {"hrmin", hb_num(id(hr_min))}, {"hrmax", hb_num(id(hr_max))},
            {"brmin", hb_num(id(br_min))}, {"brmax", hb_num(id(br_max))},
          });
          if (kind == 4) msg = "👋 Hearthbeat test (" + id(room_name).state + "). Your alert message looks like this:\n\n" + msg;
          id(tg_send).execute(msg, false);

  # Show the commands in Telegram's "/" menu (sent once after each start-up)
  - id: tg_set_commands
    then:
      - lambda: |-
          std::string body = json::build_json([](JsonObject root) {
            JsonArray cmds = root["commands"].to<JsonArray>();
            const char *list[][2] = {{"status", "How things are right now"}, {"sleep", "Last night's sleep"},
                                     {"today", "Today's ranges and alerts"}, {"help", "List the commands"}};
            for (auto &c : list) { JsonObject o = cmds.add<JsonObject>(); o["command"] = c[0]; o["description"] = c[1]; }
          });
          hb_tg::send("https://api.telegram.org/bot${telegram_token}/setMyCommands", body);

  # Answer the commands in a getUpdates response (fetched by the background task) from the configured chat only
  - id: tg_handle
    mode: queued
    max_runs: 3
    parameters:
      body: string
    then:
              - lambda: |-
                  std::vector<std::string> cmds;
                  int64_t next = id(tg_offset);
                  auto now = id(sntp_time).now();
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    for (JsonObject u : root["result"].as<JsonArray>()) {
                      int64_t uid = u["update_id"].as<int64_t>();
                      if (uid + 1 > next) next = uid + 1;
                      JsonObject m = u["message"];
                      if (m.isNull()) continue;
                      if (std::to_string(m["chat"]["id"].as<int64_t>()) != id(tg_chat).state) continue;
                      // Skip messages older than 10 minutes (sent while the sensor was offline)
                      if (now.is_valid() && (int64_t) now.timestamp - m["date"].as<int64_t>() > 600) continue;
                      std::string c = m["text"] | "";
                      if (c.empty() || c[0] != '/') continue;
                      size_t cut = c.find_first_of(" @");
                      if (cut != std::string::npos) c = c.substr(0, cut);
                      for (auto &ch : c) ch = tolower(ch);
                      cmds.push_back(c);
                    }
                    return true;
                  });
                  id(tg_offset) = next;

                  for (const auto &c : cmds) {
                    std::string r;
                    char b[96];
                    if (c == "/status") {
                      bool here = id(presence).state;
                      r = std::string(id(alert).state ? "🔴 " : here ? "🟢 " : "⚪ ") + id(room_name).state + ": " + id(status_text).state;
                      if (here) {
                        float h = id(heart_avg).state, br = id(breath_avg).state;
                        if (!std::isnan(h) || !std::isnan(br))
                          r += "\nHeart rate " + hb_num(h) + " bpm · breathing " + hb_num(br) + " /min (1-min average)";
                        float d = id(dist).state;
                        if (!std::isnan(d) && d > 0) { snprintf(b, sizeof(b), "\nDistance %.1f m", d / 100.0f); r += b; }
                      }
                      float l = id(lux).state;
                      r += std::string(here ? " · " : "\n") + "light " + (std::isnan(l) ? std::string("–") : hb_num(l)) + " lx · " + id(time_of_day).state;
                      r += "\nLast seen: " + id(last_seen_text).state;
                      float q = id(data_quality).state;
                      if (!std::isnan(q)) r += "\nData quality (last hour): " + hb_num(q) + "%";
                      if (id(radar_stuck).state) r += "\n⚠️ The radar is not responding";
                    } else if (c == "/sleep") {
                      if (id(sl_bed) == 0) {
                        r = "🌙 " + id(room_name).state + ": no bedtime detected yet.";
                      } else {
                        int mins = std::isnan(id(sleep_hours).state) ? 0 : (int) roundf(id(sleep_hours).state * 60);
                        std::string bed = ESPTime::from_epoch_local(id(sl_bed)).strftime("%H:%M");
                        if (id(sl_active)) {
                          snprintf(b, sizeof(b), " (%dh%02d so far)", mins / 60, mins % 60);
                          r = "🌙 " + id(room_name).state + ": in bed since " + bed + b;
                        } else {
                          snprintf(b, sizeof(b), " · %dh%02d in bed", mins / 60, mins % 60);
                          r = "🌙 " + id(room_name).state + ": bed " + bed + " → up " + ESPTime::from_epoch_local(id(sl_wake)).strftime("%H:%M") + b;
                        }
                        snprintf(b, sizeof(b), "\nNight wakings: %d", id(sl_ups));
                        r += b;
                      }
                    } else if (c == "/today") {
                      int n = (now.is_valid() && now.day_of_year == id(alerts_day)) ? id(alerts_today) : 0;
                      r = "📊 " + id(room_name).state + ", since midnight:";
                      r += "\nHeart rate " + hb_num(id(hr_min)) + "–" + hb_num(id(hr_max)) + " bpm";
                      r += "\nBreathing " + hb_num(id(br_min)) + "–" + hb_num(id(br_max)) + " /min";
                      r += "\nAlerts: " + std::to_string(n);
                      if (id(alert).state) r += " (now: " + id(alert_reason).state + ")";
                    } else {
                      r = "👋 Hearthbeat · " + id(room_name).state + "\n/status — how things are right now\n/sleep — last night's sleep\n/today — today's ranges and alerts\n/help — this list";
                    }
                    id(tg_send).execute(r, c == "/help" || c == "/start");
                  }

binary_sensor:
  - id: !extend alert
    on_press:
      - lambda: |-
          auto now = id(sntp_time).now();
          int day = now.is_valid() ? now.day_of_year : -1;
          if (day != id(alerts_day)) { id(alerts_day) = day; id(alerts_today) = 0; }
          id(alerts_today) += 1;
      - script.execute: {id: tg_event, kind: 0}
    on_release:
      - script.execute: {id: tg_event, kind: 1}

interval:
  # Check for chat commands every 10 seconds
  - interval: 10s
    then:
      - lambda: |-
          if (!id(tg_on_commands).state || id(tg_chat).state.empty()) return;
          if (!wifi::global_wifi_component->is_connected()) return;
          hb_tg::poll(std::string("https://api.telegram.org/bot${telegram_token}/getUpdates?timeout=0&limit=5&allowed_updates=%5B%22message%22%5D&offset=") + std::to_string(id(tg_offset)));

  # Pick up responses from the background task
  - interval: 500ms
    then:
      - lambda: |-
          std::string body;
          if (hb_tg::take_result(body)) id(tg_handle).execute(body);

  - interval: 30s
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || !wifi::global_wifi_component->is_connected()) return;
          // Once per boot: say the sensor is online
          static bool online_sent = false;
          if (!online_sent) {
            online_sent = true;
            id(tg_event).execute(2);
            id(tg_set_commands).execute();
            return;
          }
          // Morning summary, once a day at the chosen hour
          static int last_day = -1;
          if (now.hour != (int) id(tg_hour).state || now.day_of_year == last_day) return;
          last_day = now.day_of_year;
          id(tg_event).execute(3);
