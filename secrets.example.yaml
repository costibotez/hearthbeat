# Copy this file to secrets.yaml and fill in your own values. secrets.yaml is ignored by git.

# Your home Wi-Fi (must be 2.4 GHz)
wifi_ssid: "Your WiFi name"
wifi_password: "your-wifi-password"

# Password for the fallback hotspot the sensor creates if it cannot reach your Wi-Fi
ap_password: "choose-a-hotspot-password"

# Login for the dashboard at http://<name>.local
web_username: "admin"
web_password: "choose-a-dashboard-password"

# Password that firmware updates over Wi-Fi must match
ota_password: "choose-an-update-password"

# Encryption key for Home Assistant. Generate one with: openssl rand -base64 32
api_encryption_key: "paste-a-32-byte-base64-key-here"

# Optional, only for hearthbeat-telegram.yaml (see README → Telegram notifications)
# telegram_bot_token: "1234567890:AA..."
# telegram_chat_id: "123456789"
